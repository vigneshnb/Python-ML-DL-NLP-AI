# /etc/nginx/sites-available/mnist-ai.conf
# sudo ln -s /etc/nginx/sites-available/mnist-ai.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

upstream mnist_ai {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Simple per-IP rate limit for the prediction endpoint.
limit_req_zone $binary_remote_addr zone=predict_limit:10m rate=10r/s;

server {
    listen 80;
    server_name your-domain.com;   # or the EC2 public DNS / IP

    # Keep in sync with MAX_UPLOAD_MB (+ multipart overhead).
    client_max_body_size 6M;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Enable once HTTPS is configured (e.g. certbot --nginx):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Serve static assets directly.
    location /static/ {
        alias /opt/mnist-ai/app/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location /api/predict/ {
        limit_req zone=predict_limit burst=20 nodelay;
        proxy_pass http://mnist_ai;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://mnist_ai;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
