# /etc/nginx/sites-available/cifar-vision-ai
# Replace your-domain.com. After certbot runs it will add the 443 server block.

upstream cifar_vision_ai {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Must be >= MAX_UPLOAD_MB (+ multipart overhead)
    client_max_body_size 6M;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Static files served directly by Nginx
    location /static/ {
        alias /opt/cifar-vision-ai/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://cifar_vision_ai;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Basic abuse protection for the inference endpoint (define the zone in nginx.conf http{}:
    #   limit_req_zone $binary_remote_addr zone=predict:10m rate=5r/s;)
    # location /api/predict/ {
    #     limit_req zone=predict burst=10 nodelay;
    #     proxy_pass http://cifar_vision_ai;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
