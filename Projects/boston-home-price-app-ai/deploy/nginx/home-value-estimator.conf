# /etc/nginx/sites-available/home-value-estimator
# Replace example.com with your domain. After `certbot --nginx -d example.com`
# Certbot adds the 443 server block and the HTTP->HTTPS redirect.

upstream home_value_estimator {
    server 127.0.0.1:8000 fail_timeout=0;
}

limit_req_zone $binary_remote_addr zone=hve_predict:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 32k;           # app itself rejects bodies > 16 KB
    server_tokens off;

    access_log /var/log/nginx/home-value-estimator.access.log;
    error_log  /var/log/nginx/home-value-estimator.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Static files served directly by Nginx
    location /static/ {
        alias /opt/home-value-estimator/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location = /api/predict/ {
        limit_req zone=hve_predict burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://home_value_estimator;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://home_value_estimator;
        include /etc/nginx/proxy_params;   # Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
